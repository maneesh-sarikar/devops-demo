 
services:
  frontend:
    build:
      context: .
      dockerfile: Containerfile
      target: frontend
    image: localhost/devops-frontend:latest
    container_name: devops-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
 
  backend:
    build:
      context: .
      dockerfile: Containerfile
      target: backend
    image: localhost/devops-backend:latest
    container_name: devops-backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
 
  db:
    image: docker.io/library/postgres:17
    container_name: devops-postgres
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser -d devdb"]
      interval: 5s
      timeout: 5s
      retries: 5
 
volumes:
  postgres_data:
 